[workspace]
members = ["crates/wencrypt-core", "crates/wencrypt-probe"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
getrandom = "0.2"
hkdf = "0.12.4"
sha2 = "0.10.9"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
lto = "thin"
strip = true
