name: P0 checks and development packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
  packages:
    needs: core
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            rust-target: x86_64-pc-windows-msvc
            artifact: build/p0/wencrypt-windows-x64.zip
          - os: macos-15
            target: macos
            rust-target: aarch64-apple-darwin
            artifact: |
              build/p0/wencrypt-macos-arm64.zip
              build/p0/wencrypt-macos-arm64.dmg
          - os: ubuntu-latest
            target: android
            rust-target: aarch64-linux-android
            artifact: build/p0/wencrypt-android-arm64-*.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.target == 'android'
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        if: matrix.target == 'android'
        run: sdkmanager 'platforms;android-36' 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/wencrypt_flutter
      - run: flutter analyze --no-pub
        working-directory: apps/wencrypt_flutter
      - run: flutter test --no-pub
        working-directory: apps/wencrypt_flutter
      - name: Verify native vault creation and joining on Windows
        if: matrix.target == 'windows'
        run: cargo test -p wencrypt-core --release --locked --target ${{ matrix.rust-target }} vault::tests::rotates_password_without_changing_vault_and_peers_must_authenticate -- --exact
      - name: Verify native Windows image clipboard
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $studio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$studio) { throw 'Visual Studio C++ tools not found' }
          $command = Join-Path $env:RUNNER_TEMP 'wencrypt-clipboard-test.cmd'
          @"
          @call "$studio\Common7\Tools\VsDevCmd.bat" -arch=x64
          @if errorlevel 1 exit /b %errorlevel%
          @cd /d "$env:RUNNER_TEMP"
          @cl /nologo /EHsc /W4 /WX /std:c++17 "$env:GITHUB_WORKSPACE\tools\windows_image_clipboard_test.cpp" "$env:GITHUB_WORKSPACE\apps\wencrypt_flutter\windows\runner\image_clipboard.cpp" /Fe:wencrypt-clipboard-test.exe ole32.lib user32.lib uuid.lib windowscodecs.lib
          @if errorlevel 1 exit /b %errorlevel%
          @wencrypt-clipboard-test.exe
          "@ | Set-Content -Path $command -Encoding ascii
          cmd /d /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check macOS probe failure paths
        if: matrix.target == 'macos'
        run: |
          swiftc platform_probes/macos/DeviceProbe.swift platform_probes/macos/main.swift -o "$RUNNER_TEMP/wencrypt-device-probe"
          WENCRYPT_MACOS_PROBE="$RUNNER_TEMP/wencrypt-device-probe" python3 -m unittest discover -s tools -p test_macos_probe.py -v
      - name: Build package
        if: matrix.target != 'android' || github.event_name != 'push' || github.ref != 'refs/heads/main' || github.repository != 'WendelYu/Wencrypt'
        run: python tools/package_p0.py ${{ matrix.target }}
      - name: Build unsigned Android release
        if: matrix.target == 'android' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'WendelYu/Wencrypt'
        run: python tools/package_p0.py android --android-release
      - uses: actions/upload-artifact@v4
        with:
          name: wencrypt-p0-${{ matrix.target }}-${{ github.sha }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'WendelYu/Wencrypt'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wencrypt-release
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' apps/wencrypt_flutter/pubspec.yaml)
          test -n "$version"
          tag="v$version"
          # If main was bumped again during this build, the newer workflow owns the release.
          git fetch --no-tags origin main
          latest=$(git show FETCH_HEAD:apps/wencrypt_flutter/pubspec.yaml |
            sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p')
          test "$latest" = "$version" || exit 0
          if gh release view "$tag" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.tag != ''
        with:
          pattern: wencrypt-p0-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-java@v4
        if: steps.version.outputs.tag != ''
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.tag != ''
        with:
          packages: build-tools;36.0.0
      - name: Sign Android release and verify its certificate
        if: steps.version.outputs.tag != ''
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          bash tools/sign_android_release.sh "$ANDROID_HOME/build-tools/36.0.0" \
            release-assets/wencrypt-android-arm64-unsigned.apk \
            release-assets/wencrypt-android-arm64.apk
      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        working-directory: release-assets
        run: |
          assets=()
          for package in wencrypt-macos-arm64.dmg wencrypt-windows-x64.zip wencrypt-android-arm64.apk; do
            name="wencrypt-$TAG-${package#wencrypt-}"
            mv -- "$package" "$name"
            assets+=("$name")
          done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          notes="$RUNNER_TEMP/wencrypt-release-notes.md"
          version_notes="../.github/releases/$TAG.md"
          if [ -f "$version_notes" ]; then
            cat "$version_notes" > "$notes"
            printf '\n\n' >> "$notes"
          else
            : > "$notes"
          fi
          sed "s/@TAG@/$TAG/g" ../.github/release-notes.md >> "$notes"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -qx true; then
            previous=$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')
            if [ "$previous" != "$GITHUB_SHA" ]; then
              echo "Draft $TAG targets $previous. Rerun that build to finish publishing it."
              exit 1
            fi
            gh release upload "$TAG" "${assets[@]}" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" "${assets[@]}" SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Wencrypt $TAG" \
              --notes-file "$notes" --generate-notes
          fi
